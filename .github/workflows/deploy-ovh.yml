name: Build for OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ovh-production
  cancel-in-progress: true

jobs:
  build-ovh:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Installer les dépendances
        working-directory: source
        run: npm ci

      - name: Construire le site
        working-directory: source
        run: npm run build

      - name: Récupérer la branche OVH existante
        uses: actions/checkout@v4
        with:
          ref: ovh
          fetch-depth: 0
          path: publication

      - name: Remplacer le site compilé
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            source/dist/ publication/

      - name: Publier la nouvelle version
        working-directory: publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
          else
            git commit -m "Deploy OVH ${GITHUB_SHA}"
            git push origin HEAD:ovh
          fi
